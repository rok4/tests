version: "3"
services:

  storage:
    image: rok4/dataset:minio

  middle:
    image: rok4/server:${TAG}
    environment:
      - ROK4_S3_SECRETKEY=rok4S3storage
      - ROK4_S3_KEY=rok4
      - ROK4_S3_URL=http://storage:9000
    volumes:
      - ./configurations/server.docker.json:/configurations/server.json
      - ./configurations/services.docker.json:/configurations/services.json
      - ./configurations/equals_crs.json:/configurations/equals_crs.json
    depends_on:
      - storage

  front:
    image: nginx:alpine
    links:
      - middle
    volumes:
      - ./configurations/default.conf.template:/etc/nginx/templates/default.conf.template
    depends_on:
      - middle

  client:
    image: alpine/bruno:1.30.0
    links:
      - front
    volumes:
      - ./bruno:/apps
      - ./results:/output
    working_dir: /apps
    depends_on:
      - front
    command: run -r --output /output/results.json --format json --env-var "endpoint=http://front"
    


